services:
  db:
    image: mysql:8.0
    container_name: clinica_imagenes_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin12345}
      MYSQL_DATABASE: ${DB_NAME:-clinica_imagenes_main}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      # Datos persistentes del contenedor (sobreviven a docker-compose down).
      - db_data:/var/lib/mysql
      # Scripts que MySQL ejecuta UNA SOLA VEZ, cuando el volumen db_data
      # esta vacio (primer arranque). Ahi vive la copia de la base de datos.
      - ./db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data: